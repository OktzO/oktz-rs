name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      - run: cp target/release/oktz oktz-linux-x64 && chmod +x oktz-linux-x64
      # Aset statis: panel Alpine/musl tidak punya loader glibc, jadi binary
      # dinamis gagal exec (ENOENT) walau berkasnya ada.
      - run: cargo build --release --target x86_64-unknown-linux-gnu
        env:
          RUSTFLAGS: -C target-feature=+crt-static
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      - run: cp target/x86_64-unknown-linux-gnu/release/oktz oktz-linux-x64-static && chmod +x oktz-linux-x64-static
      - run: "! readelf -l oktz-linux-x64-static | grep -q INTERP"
      # ffmpeg+ffprobe statis: build johnvansickle dari source FFmpeg asli
      # (tanpa modifikasi), diambil lewat mirror rilis ffmpeg-static b6.1.1
      # di GitHub — situs johnvansickle ber-antibot, sedangkan aset release
      # GitHub immutable sehingga byte-nya selalu sama untuk tag ini.
      # Aset tetap gzip (launcher gunzip pakai node zlib); checksum dihitung
      # dari isi yang sudah gunzip.
      - run: |
          curl -fsSL -o ffmpeg.gz  https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-linux-x64.gz
          curl -fsSL -o ffprobe.gz https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffprobe-linux-x64.gz
          gunzip -c ffmpeg.gz > ffmpeg && chmod +x ffmpeg
          ./ffmpeg -version | head -1
          rm ffmpeg
          mv ffmpeg.gz  ffmpeg-linux-x64-static.gz
          mv ffprobe.gz ffprobe-linux-x64-static.gz
          gunzip -c ffmpeg-linux-x64-static.gz  | sha256sum > ffmpeg-linux-x64-static.sha256
          gunzip -c ffprobe-linux-x64-static.gz | sha256sum > ffprobe-linux-x64-static.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            oktz-linux-x64
            oktz-linux-x64-static
            ffmpeg-linux-x64-static.gz
            ffprobe-linux-x64-static.gz
            ffmpeg-linux-x64-static.sha256
            ffprobe-linux-x64-static.sha256
          generate_release_notes: true
