[package]
name = "oktz-plugins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
oktz-plugin-api = { path = "../lib/oktz-plugin-api" }
tracing.workspace = true
# Scraper hasil port `src/scraper/` JS. Plugin memanggil crate ini, bukan
# menyalin logikanya — supaya hanya ada satu versi tiap scraper.
oktz-scraper = { path = "../lib/oktz-scraper" }
# `#[plugin]` memancarkan `linkme::distributed_slice`, jadi crate yang memakai
# macro WAJIB punya linkme sebagai direct dependency.
linkme = "0.3"
rand = "0.9"
# Challenge duck.ai dijalankan sebagai JS; QuickJS di-embed (C statis), bukan proses luar.
rquickjs = "0.14"
sha2 = "0.11"
# Tipe `Value` hanya, untuk baca state tersimpan lewat `Ctx::user_field` /
# `group_field`. Tidak ada I/O store di crate ini.
serde_json.workspace = true
# `.clearsession`: hapus snapshot basi di Turso (helper murni di oktz-store).
oktz-store = { path = "../lib/oktz-store" }
oktz-core = { path = "../lib/oktz-core" }
oktz-wa = { path = "../lib/oktz-wa" }
tokio = { version = "1.53", features = ["rt", "macros"] }
